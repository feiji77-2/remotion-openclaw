name: Bug report
description: Report a Project JSON validation or Remotion rendering issue
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the observed behavior and affected command.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Project JSON
      description: Provide a minimal redacted Project JSON reproduction.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Command output
      description: Include project:check, still, or render output.
    validations:
      required: true
