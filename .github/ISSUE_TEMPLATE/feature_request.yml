name: Feature request
description: Propose a Project contract, scene family, or rendering capability
body:
  - type: textarea
    attributes:
      label: Use case
      description: Describe the video result that cannot be expressed today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Project JSON
      description: Show the smallest input shape needed for the capability.
    validations:
      required: true
