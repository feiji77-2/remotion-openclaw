name: Feature request
description: Propose an improvement within the current Skill Showcase renderer contract
body:
  - type: textarea
    attributes:
      label: Use case
      description: Describe which existing Cinematic preset or Hero Track kind should be improved.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Project JSON
      description: Show the smallest skill-showcase payload needed for the change.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Existing renderer target
      description: Name one current Cinematic preset or Hero Track kind to extend; new renderer branches are out of scope.
    validations:
      required: true
