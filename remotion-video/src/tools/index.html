<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Factory Console</title>
</head>
<body>
  <div id="root"></div>
  <script>
    if (location.protocol === 'file:' && location.pathname.includes('/src/tools/')) {
      document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#070b10;color:#eef6f8;font-family:Inter,system-ui,sans-serif;padding:32px"><div style="max-width:720px;border:1px solid rgba(62,234,216,.35);background:rgba(12,17,24,.88);padding:28px"><div style="color:#3eead8;font-size:12px;font-weight:900;margin-bottom:12px">Video Factory Console</div><h1 style="font-size:28px;line-height:1.16;margin:0 0 14px">这个源码入口需要通过 Vite 打开</h1><p style="color:#90a0ac;line-height:1.6;margin:0 0 18px">当前打开的是 file:// 路径，浏览器不会编译 TSX，也会限制模块资源加载。请使用本地 HTTP 预览。</p><code style="display:block;white-space:pre-wrap;color:#78f3a6;background:rgba(0,0,0,.28);padding:14px">npm run tools:dev -- --port 5177\nhttp://127.0.0.1:5177/\n\nnpm run tools:build\nnpm run tools:preview -- --port 4177\nhttp://127.0.0.1:4177/</code></div></div>';
    }
  </script>
  <script type="module" src="./console/index.tsx"></script>
</body>
</html>
